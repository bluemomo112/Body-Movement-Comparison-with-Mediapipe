<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dance Trainer</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ── Top Bar ─────────────────────────────────────────────────── -->
<div class="topbar">
  <h1>Dance Trainer</h1>
  <div class="modes">
    <button class="btn active" id="btnSide" onclick="setMode('side')">并排模式</button>
    <button class="btn" id="btnFusion" onclick="setMode('fusion')">融合模式</button>
  </div>
  <div class="hint">Space = 同步播放/暂停 &nbsp;|&nbsp; 融合模式: 拖拽移动, 滚轮缩放</div>
</div>

<!-- ── Side-by-side Mode ──────────────────────────────────────── -->
<div class="container" id="sideContainer">

  <!-- Left: Coach -->
  <div class="side-panel">
    <div class="label">教练视频</div>
    <div class="video-wrap" id="coachWrap">
      <video id="coachVideo" loop playsinline></video>
      <div class="placeholder" id="coachPlaceholder">
        点击下方「选择文件」上传教练视频
      </div>
    </div>
    <div class="progress-bar" id="coachProgress">
      <div class="fill" id="coachFill"></div>
      <div class="thumb" id="coachThumb"></div>
    </div>
    <div class="controls">
      <div class="group">
        <button class="btn btn-sm" onclick="togglePlay('coach')">⏯</button>
        <label>
          <input type="file" accept="video/*" onchange="loadFile(this,'coach')">
          <span class="btn btn-sm">选择文件</span>
        </label>
      </div>
      <div class="group">
        <label>速度</label>
        <select onchange="setSpeed('coach', this.value)">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
      <div class="group">
        <button class="btn btn-sm" id="coachMirrorBtn" onclick="toggleMirror('coach')">镜像</button>
      </div>
      <div class="group">
        <button class="btn btn-sm" id="coachMuteBtn" onclick="toggleMute('coach')">🔊</button>
      </div>
      <div class="group">
        <button class="btn btn-sm btn-seg" id="coachSegBtn" onclick="openSegPopup('coach', this)">✂ 裁剪</button>
      </div>
      <div class="group">
        <button class="btn btn-sm btn-save" id="coachSaveBtn" onclick="downloadCroppedVideo('coach')" style="display:none;">保存</button>
      </div>
      <div class="group">
        <label id="coachTime">0:00.00 / 0:00.00</label>
      </div>
    </div>
    <div class="trim-bar" id="coachTrimBar">
      <label>裁剪</label>
      <span class="trim-val" id="coachTrimStartVal">0:00.00</span>
      <div class="trim-range-wrap">
        <div class="trim-track"></div>
        <div class="trim-highlight" id="coachTrimHighlight"></div>
        <input type="range" min="0" max="1000" value="0" step="1" id="coachTrimStart" oninput="onTrimChange('coach')">
        <input type="range" min="0" max="1000" value="1000" step="1" id="coachTrimEnd" oninput="onTrimChange('coach')">
      </div>
      <span class="trim-val" id="coachTrimEndVal">0:00.00</span>
      <label id="coachTrimDuration" style="color:#e94560;">= 0.00s</label>
    </div>
  </div>

  <!-- Right: User -->
  <div class="side-panel">
    <div class="label">
      用户视频
      <button class="btn btn-sm" id="srcWebcam" onclick="setUserSource('webcam')" style="margin-left:8px;">Webcam</button>
      <select id="cameraSelect" style="display:none;margin-left:4px;background:#1a1a2e;color:#eee;border:1px solid #444;border-radius:4px;padding:2px 4px;font-size:12px;" onchange="switchCamera(this.value)"></select>
      <button class="btn btn-sm" id="cameraRefresh" style="display:none;margin-left:2px;padding:2px 6px;" onclick="refreshCameraList()" title="刷新摄像头列表">↺</button>
      <button class="btn btn-sm" id="srcFile" onclick="setUserSource('file')">上传视频</button>
    </div>
    <div class="video-wrap" id="userWrap">
      <video id="userVideo" loop playsinline></video>
      <div class="placeholder" id="userPlaceholder">
        选择「Webcam」或「上传视频」
      </div>
    </div>
    <div class="progress-bar" id="userProgress">
      <div class="fill" id="userFill"></div>
      <div class="thumb" id="userThumb"></div>
    </div>
    <div class="controls">
      <div class="group">
        <button class="btn btn-sm" onclick="togglePlay('user')">⏯</button>
        <label id="userFileLabel" style="display:none;">
          <input type="file" accept="video/*" onchange="loadFile(this,'user')">
          <span class="btn btn-sm">选择文件</span>
        </label>
      </div>
      <div class="group">
        <label>速度</label>
        <select onchange="setSpeed('user', this.value)">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
      <div class="group">
        <button class="btn btn-sm" id="userMirrorBtn" onclick="toggleMirror('user')">镜像</button>
      </div>
      <div class="group">
        <button class="btn btn-sm" id="userMuteBtn" onclick="toggleMute('user')">🔇</button>
      </div>
      <div class="group">
        <button class="btn btn-sm btn-seg" id="userSegBtn" onclick="openSegPopup('user', this)">✂ 裁剪</button>
      </div>
      <div class="group">
        <button class="btn btn-sm btn-save" id="userSaveBtn" onclick="downloadCroppedVideo('user')" style="display:none;">保存</button>
      </div>
      <div class="group">
        <label id="userTime">0:00.00 / 0:00.00</label>
      </div>
    </div>
    <div class="trim-bar" id="userTrimBar">
      <label>裁剪</label>
      <span class="trim-val" id="userTrimStartVal">0:00.00</span>
      <div class="trim-range-wrap">
        <div class="trim-track"></div>
        <div class="trim-highlight" id="userTrimHighlight"></div>
        <input type="range" min="0" max="1000" value="0" step="1" id="userTrimStart" oninput="onTrimChange('user')">
        <input type="range" min="0" max="1000" value="1000" step="1" id="userTrimEnd" oninput="onTrimChange('user')">
      </div>
      <span class="trim-val" id="userTrimEndVal">0:00.00</span>
      <label id="userTrimDuration" style="color:#e94560;">= 0.00s</label>
    </div>
  </div>
</div>

<!-- ── Fusion Mode ────────────────────────────────────────────── -->
<div class="fusion-container" id="fusionContainer">
  <div class="fusion-video" id="fusionCoach" style="width:50%; left:25%; top:5%;">
    <div class="tag">教练</div>
    <video id="fusionCoachVideo" loop playsinline></video>
    <div class="resize-handle"></div>
  </div>
  <div class="fusion-video" id="fusionUser" style="width:50%; left:25%; top:5%;">
    <div class="tag">用户</div>
    <video id="fusionUserVideo" loop playsinline></video>
    <div class="resize-handle"></div>
  </div>

  <div class="fusion-controls">
    <!-- Progress bars for fusion mode -->
    <div style="width:100%; display:flex; flex-direction:column; gap:4px; margin-bottom:4px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <label style="font-size:11px; color:#e94560; width:36px;">教练</label>
        <div class="progress-bar" id="fusionCoachProgress" style="flex:1;">
          <div class="fill" id="fusionCoachFill"></div>
          <div class="thumb" id="fusionCoachThumb"></div>
        </div>
        <label style="font-size:11px; color:#999; min-width:100px;" id="fusionCoachTime">0:00.00 / 0:00.00</label>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <label style="font-size:11px; color:#e94560; width:36px;">用户</label>
        <div class="progress-bar" id="fusionUserProgress" style="flex:1;">
          <div class="fill" id="fusionUserFill"></div>
          <div class="thumb" id="fusionUserThumb"></div>
        </div>
        <label style="font-size:11px; color:#999; min-width:100px;" id="fusionUserTime">0:00.00 / 0:00.00</label>
      </div>
    </div>
    <!-- Coach controls -->
    <div class="section">
      <label style="color:#e94560;font-weight:600;">教练</label>
      <button class="btn btn-sm" onclick="togglePlay('coach')">⏯</button>
      <label>速度</label>
      <select onchange="setSpeed('coach', this.value)" id="fusionCoachSpeed">
        <option value="0.25">0.25x</option><option value="0.5">0.5x</option>
        <option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option>
      </select>
      <button class="btn btn-sm" onclick="toggleMirror('coach')">镜像</button>
      <button class="btn btn-sm" id="fusionCoachMuteBtn" onclick="toggleMute('coach')">🔊</button>
      <label>透明度</label>
      <input type="range" min="0" max="100" value="100" oninput="setOpacity('coach', this.value)">
    </div>
    <!-- User controls -->
    <div class="section">
      <label style="color:#e94560;font-weight:600;">用户</label>
      <button class="btn btn-sm" onclick="togglePlay('user')">⏯</button>
      <label>速度</label>
      <select onchange="setSpeed('user', this.value)" id="fusionUserSpeed">
        <option value="0.25">0.25x</option><option value="0.5">0.5x</option>
        <option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option>
      </select>
      <button class="btn btn-sm" onclick="toggleMirror('user')">镜像</button>
      <button class="btn btn-sm" id="fusionUserMuteBtn" onclick="toggleMute('user')">🔇</button>
      <label>透明度</label>
      <input type="range" min="0" max="100" value="60" oninput="setOpacity('user', this.value)">
    </div>
    <!-- Global -->
    <div class="section">
      <button class="btn btn-sm" onclick="syncPlayPause()">同步 ⏯ (Space)</button>
      <button class="btn btn-sm" onclick="syncRestart()">同步重置</button>
      <button class="btn btn-sm" id="alignBtn" onclick="smartAlign()" style="display:none;">🎵 智能对齐</button>
    </div>
    <!-- Trim controls in fusion -->
    <div style="width:100%; display:flex; flex-direction:column; gap:2px; margin-top:4px; border-top:1px solid #333; padding-top:6px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <label style="font-size:11px; color:#e94560; width:36px;">教练裁剪</label>
        <span class="trim-val" id="fusionCoachTrimStartVal">0:00.00</span>
        <div class="trim-range-wrap" style="flex:1;">
          <div class="trim-track"></div>
          <div class="trim-highlight" id="fusionCoachTrimHighlight"></div>
          <input type="range" min="0" max="1000" value="0" step="1" id="fusionCoachTrimStart" oninput="onTrimChange('coach')">
          <input type="range" min="0" max="1000" value="1000" step="1" id="fusionCoachTrimEnd" oninput="onTrimChange('coach')">
        </div>
        <span class="trim-val" id="fusionCoachTrimEndVal">0:00.00</span>
        <label id="fusionCoachTrimDuration" style="font-size:11px;color:#e94560;">= 0.00s</label>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <label style="font-size:11px; color:#e94560; width:36px;">用户裁剪</label>
        <span class="trim-val" id="fusionUserTrimStartVal">0:00.00</span>
        <div class="trim-range-wrap" style="flex:1;">
          <div class="trim-track"></div>
          <div class="trim-highlight" id="fusionUserTrimHighlight"></div>
          <input type="range" min="0" max="1000" value="0" step="1" id="fusionUserTrimStart" oninput="onTrimChange('user')">
          <input type="range" min="0" max="1000" value="1000" step="1" id="fusionUserTrimEnd" oninput="onTrimChange('user')">
        </div>
        <span class="trim-val" id="fusionUserTrimEndVal">0:00.00</span>
        <label id="fusionUserTrimDuration" style="font-size:11px;color:#e94560;">= 0.00s</label>
      </div>
    </div>
  </div>
</div>

<!-- ── Person Selection Popup ──────────────────────────── -->
<div class="person-popup" id="personPopup">
  <h4>选择要保留的人物</h4>
  <div class="person-grid" id="personGrid"></div>
  <button class="btn-cancel" onclick="closePersonPopup()">取消</button>
</div>

<!-- ── Segmentation Loading Overlay ──────────────────────────── -->
<div class="seg-overlay" id="segOverlay">
  <div class="seg-box">
    <h2>正在裁剪视频...</h2>
    <p class="seg-sub" id="segSubtitle">正在追踪并裁剪人物，请稍候</p>
    <div class="seg-progress-track">
      <div class="seg-progress-fill" id="segProgressFill"></div>
    </div>
    <div class="seg-pct" id="segPct">0%</div>
    <div class="seg-eta" id="segEta">预计剩余时间：计算中...</div>
    <button class="seg-cancel" onclick="closeSegOverlay()">后台运行（关闭此窗口）</button>
  </div>
</div>

<script src="/static/js/app.js"></script>
</script>
</body>
</html>
